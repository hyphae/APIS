version: '3.8'

services:
  # NGINX API Gateway with ModSecurity WAF
  api-gateway:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: apis-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./modsec:/etc/nginx/modsec:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./cache:/var/cache/nginx
      - ./logs:/var/log/nginx
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - apis-network
    restart: unless-stopped
    depends_on:
      - certbot
    environment:
      - TZ=UTC
      - NGINX_ALWAYS_TLS_REDIRECT=true
      - MODSEC_RULE_ENGINE=On
      - PARANOIA=2
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4

  # Certbot for SSL/TLS certificates
  certbot:
    image: certbot/certbot:latest
    container_name: apis-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - apis-network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: apis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - apis-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: apis-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - apis-network
    restart: unless-stopped

  # Redis for advanced caching
  redis:
    image: redis:7-alpine
    container_name: apis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - apis-network
    restart: unless-stopped

networks:
  apis-network:
    driver: bridge

volumes:
  certbot-webroot:
  prometheus-data:
  grafana-data:
  redis-data:
