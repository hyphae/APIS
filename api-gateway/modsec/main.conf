# ModSecurity Configuration for APIS API Gateway
# Web Application Firewall (WAF) Protection
# Issue #43: Security Hardening

# Include the recommended configuration
Include /etc/nginx/modsec/modsecurity.conf

# OWASP ModSecurity Core Rule Set (CRS)
Include /etc/nginx/modsec/owasp-crs/crs-setup.conf
Include /etc/nginx/modsec/owasp-crs/rules/*.conf

# Custom Rules for APIS
SecRule REQUEST_HEADERS:Content-Type "text/xml" \
    "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

SecRule REQUEST_HEADERS:Content-Type "application/json" \
    "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Rate limiting rules
SecAction "id:900200,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR},initcol:user=%{REMOTE_ADDR}"

# Block suspicious user agents
SecRule REQUEST_HEADERS:User-Agent "@pm nikto sqlmap nmap masscan" \
    "id:'200002',phase:1,deny,status:403,msg:'Malicious scanner detected'"

# API-specific rules
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:'200003',phase:1,pass,nolog,setvar:tx.api_request=1"

# Enforce JSON for API endpoints
SecRule TX:API_REQUEST "@eq 1" \
    "chain,id:'200004',phase:2,deny,status:415,msg:'Invalid Content-Type for API endpoint'"
    SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/json" \
        "t:none,t:lowercase"
